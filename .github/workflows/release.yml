name: Release

# 在 GitHub 页面上 Publish release 时触发
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: mac-amd64
          - goos: darwin
            goarch: arm64
            name: mac-arm64
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: windows
            goarch: amd64
            name: windows-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          OUT=vetix-${{ matrix.name }}
          if [ "${{ matrix.goos }}" = "windows" ]; then OUT="$OUT.exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X vetix/internal/buildinfo.Version=${{ github.event.release.tag_name }}" \
            -o "$OUT" ./cmd/vetix

      # 打包压缩
      - name: Pack
        run: |
          BIN=vetix-${{ matrix.name }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "vetix-${{ matrix.name }}.zip" "$BIN.exe"
          else
            tar -czf "vetix-${{ matrix.name }}.tar.gz" "$BIN"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vetix-*.tar.gz
            vetix-*.zip
