<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: {{PRIMARY_COLOR}};
    --paper: #050505;
    --ink: #f3efe7;
    --muted: rgba(243, 239, 231, 0.58);
    --line: rgba(243, 239, 231, 0.14);
  }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 86px 120px 94px;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 42px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    font-size: 23px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h2 {
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    font-size: 68px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .count {
    font-size: 25px;
    color: var(--muted);
    font-weight: 700;
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    margin-top: 74px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .card {
    background: #090909;
    min-height: 600px;
    padding: 58px 54px 52px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .card.featured {
    background: #0f0d08;
    color: #fffaf0;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .card-icon {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 64px;
    line-height: 1;
    color: rgba(243,239,231,0.16);
  }
  .featured .card-icon {
    color: rgba(255,250,240,0.32);
  }
  .card-tag {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .featured .card-tag {
    color: rgba(255,250,240,0.78);
  }
  .card-title {
    margin-top: 34px;
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  .featured .card-title {
    color: #fffaf0;
  }
  .card-desc {
    margin-top: 30px;
    font-size: 25px;
    line-height: 1.45;
    font-weight: 600;
    color: var(--muted);
    max-width: 430px;
  }
  .featured .card-desc {
    color: rgba(255,250,240,0.84);
  }
  .rule {
    width: 100%;
    height: 2px;
    background: var(--line);
    margin-top: 48px;
  }
  .featured .rule {
    background: rgba(255,250,240,0.34);
  }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div>
      <div class="eyebrow">What the reader remembers</div>
      <h2>三个结果，足够了</h2>
    </div>
    <div class="count">{{FEATURE_COUNT}} core outcomes</div>
  </header>
  <section class="grid">
    {{FEATURE_CARDS}}
  </section>
</main>
</body>
</html>
