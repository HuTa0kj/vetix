services:
  vetix:
    build: .
    image: vetix:latest
    init: true                    # forward Ctrl+C (SIGINT) to the scan process
    working_dir: /work
    volumes:
      - ./config.yaml:/work/config.yaml:ro   # LLM credentials (required)
      - ./skills:/skills:ro                  # skill directories to scan
      - ./output:/work/output                # reports land in ./output/<hash>/
    # One-shot CLI: never `docker compose up`. Use:
    #   docker compose run --rm vetix -s /skills/<name>
